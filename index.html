<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadConsult Portal v7.0 - Clean Build</title>
    <style>
        :root {
            --primary: #0070f3;
            --secondary: #001838;
            --light: #f4f6f9;
            --dark: #333;
            --success: #00cc88;
            --error: #ff3333;
            --warning: #ffaa00;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: var(--light);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 1rem;
            background: linear-gradient(135deg, var(--secondary) 0%, #002c66 100%);
        }
        .auth-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .auth-card h2 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }
        .auth-card p {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }
        .auth-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .auth-toggle {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #555;
        }
        .auth-toggle span {
            color: var(--primary);
            cursor: pointer;
            font-weight: bold;
        }
        .alert-box {
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }
        .alert-danger { background: #ffe5e5; color: var(--error); border: 1px solid #ffcccc; }
        .alert-success { background: #e5ffe5; color: var(--success); border: 1px solid #ccffcc; }
        .alert-warning { background: #fff5e5; color: var(--warning); border: 1px solid #ffeecc; }

        .app-wrapper {
            display: none;
            flex-direction: column;
            flex: 1;
        }
        header {
            background: var(--secondary);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-weight: bold;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .container {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }
        .portal-section {
            display: none;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
        }
        .portal-section.active {
            display: block;
        }
        h2.section-title {
            color: var(--secondary);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--light);
            padding-bottom: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--light);
            padding: 1.5rem;
            border-radius: 6px;
            border-left: 4px solid var(--primary);
        }
        .card h3 {
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }
        button.action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 1rem;
            width: 100%;
        }
        
        .approval-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .approval-table th, .approval-table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .approval-table th {
            background: var(--secondary);
            color: white;
        }
        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-pending { background: #fff0cc; color: var(--warning); }
        .badge-approved { background: #ccffeb; color: var(--success); }
        .btn-group {
            display: flex;
            gap: 5px;
        }
        .btn-small {
            padding: 0.3rem 0.6rem;
            border: none;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-approve { background: var(--success); }
        .btn-reject { background: var(--error); }

        .dicom-container {
            background: #111;
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
        }
        .dicom-canvas-wrapper {
            width: 100%;
            height: 180px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .xray-svg {
            width: 120px;
            height: 120px;
            fill: #fff;
            transition: filter 0.1s ease;
        }
        .dicom-controls {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .dicom-controls label {
            color: #aaa;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
        }
        .dicom-controls input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        .chat-workspace {
            display: none;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 1.5rem;
            border: 1px solid #ddd;
        }
        .chat-header {
            background: var(--primary);
            color: white;
            padding: 1rem;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-chat-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .chat-messages {
            height: 200px;
            overflow-y: auto;
            padding: 1rem;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .message.incoming { background: #e2e8f0; color: #333; align-self: flex-start; }
        .message.outgoing { background: var(--primary); color: white; align-self: flex-end; }
        .chat-input-area {
            display: flex;
            padding: 0.75rem;
            border-top: 1px solid #eee;
        }
        .chat-input-area input {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
        .chat-input-area button {
            background: var(--success);
            color: white;
            border: none;
            padding: 0 1rem;
            margin-left: 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="authScreen" class="auth-container">
        <div class="auth-card">
            <h2 id="authTitle">Sign In</h2>
            <p id="authSub">Access the secure RadConsult Network</p>
